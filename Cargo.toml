[package]
name = "wikitui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ego-tree = "0.11.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "gzip"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
textwrap = "0.16.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "sync"] }
toml = "1.1.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
urlencoding = "2.1.3"
zstd = "0.13.3"
