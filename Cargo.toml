[package]
name = "wikitui"
# 0.1.0 was a placeholder left over from the project's very first commit;
# every §12 milestone from v0.5 "Reader" through v1.0 "Librarian" and most
# of v1.x/v2 (accounts, splits/bilingual, offline search, TTS, reading
# stats, experimental RTL, the UI-localization string-table seam) is
# implemented and tested, so 0.1.0 badly understated the shipped scope.
# 0.9.0 is the honest label for where this actually sits: feature-complete
# against nearly the whole PRD, but pre-1.0 because §6.8's performance
# targets are unvalidated on real hardware (see README's Performance
# section), packaging (Homebrew/AUR/nixpkgs/release binaries) isn't
# published, and this is the first commit to add CI at all — none of
# which should be true of a real "1.0". Not "2.0": that would claim the
# full v2 milestone (full bidi, real UI translations, wiki:// OS
# auto-registration) is done, which it isn't.
version = "0.9.0"
edition = "2024"
description = "An unofficial, keyboard-first terminal (TUI) client for Wikipedia and Wikimedia sister projects"
# The LICENSE file in this repo is the unmodified AGPL-3.0 text with no
# project-specific "or any later version" notice attached (its own "how to
# apply these terms" appendix is the FSF's generic template for *other*
# projects, not this one's applied choice) — so the precise SPDX identifier
# is the closed variant, not "-or-later" (PRD §10 just says "AGPL-3.0",
# which this resolves unambiguously in the conservative direction).
license = "AGPL-3.0-only"
repository = "https://github.com/iamfoz/wikitui"
homepage = "https://github.com/iamfoz/wikitui"
readme = "README.md"
authors = ["Martyn Forryan <9133432+iamfoz@users.noreply.github.com>"]
keywords = ["wikipedia", "tui", "terminal", "cli", "reader"]
categories = ["command-line-utilities", "text-processing"]
# PRD §8's MSRV policy: "stable minus two" releases, bumped only as a minor-
# version event (matters for nixpkgs/Debian/Fedora toolchain pinning). At the
# time this was set, stable was 1.94; two releases back is 1.92 — bump this
# alongside a new stable release, not preemptively.
rust-version = "1.92"

[features]
# PRD SEC-4 / §5.9: the OS-keychain token backend (`keyring` crate). Off by
# default — the 0600-file store (always compiled) is the portable fallback,
# and a headless build (no D-Bus Secret Service, no macOS/Windows keychain,
# as in CI and containers) has nothing for `keyring` to talk to. Packagers
# targeting a desktop enable this so tokens land in the real OS keychain; the
# code behind it (`auth::KeyringTokenStore`) compiles against `keyring`'s
# stable `Entry` API but is unverifiable where no secret service exists. See
# `auth.rs`'s module doc for the full keychain-vs-file rationale.
#
# Build requirements when enabled: the Linux backend (`sync-secret-service`)
# links `libdbus-1` (`sudo apt install libdbus-1-dev pkg-config`); macOS and
# Windows use their native keychains and need no extra system packages. A
# headless container without libdbus (this build environment) cannot compile
# the feature — hence off by default, with the 0600 file store standing in.
keychain = ["dep:keyring"]

# PRD FR-RD-7 (v1.x): richer Unicode math layout behind an off-by-default
# feature flag. When enabled, `layout::render_math_display` upgrades from
# B14's `⟨tex⟩` passthrough (still the default) to `doc::render_math_layout`
# — a pure-Rust, deliberately-simple Unicode renderer (fractions as `a⁄b`,
# `\sqrt` as `√…`, common operator/relation/arrow macros to their Unicode
# glyphs, super/subscript stacking where Unicode allows). No C dependency
# (the PRD's utftex/libtexprintf option is deliberately not taken — see
# `doc::render_math_layout`'s scope note). Complex TeX still falls back to
# raw passthrough even with the flag on; the default build is byte-identical
# to before this feature existed.
math-layout = []

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ego-tree = "0.11.0"
# PRD FR-ACC-1 / §5.9: a proper CSPRNG for the PKCE `code_verifier` and the
# CSRF `state` parameter — never a PRNG or clock-seeded source. `getrandom`
# (already in the tree transitively) is the lightest option: a thin wrapper
# over the OS entropy source, no `rand` distribution machinery pulled in.
getrandom = "0.2"
# PRD FR-RD-9 (v1.x soft hyphenation): Knuth-Liang hyphenation. The crate
# bundles the TeX hyphenation patterns; `embed_en-us` compiles the en-US
# patterns straight into the binary (no runtime pattern-file load), which is
# the only language wikitui enables — `layout::en_us_dict`/`try_hyphenate`.
# Words in scripts/languages without a loaded pattern set simply aren't
# hyphenated (see `layout::try_hyphenate`'s scope note).
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# PRD FR-OFF-8: the Kiwix ZIM offline read-backend. §6.1's accepted-cost note
# ("Rust ZIM bindings are immature") is about `libzim` bindings specifically
# — evaluated and rejected here as `zim-rs`/`zim-sys`, which link the real
# `libzim` C++ library via `pkg-config` and fail to build in any environment
# without `libzim-dev` installed (this one included; same shape of failure as
# the `keychain` feature's `libdbus-1` requirement above, just unconditional
# since `zim-sys` has no off-by-default gate to hide behind). `zim` (this
# crate, unrelated to the `zim-rs` family beyond the file format) is a
# from-scratch pure-Rust reader with no C dependency of its own — it builds
# clean here — at the cost of pulling in a moderately heavy transitive tree
# (rayon, indicatif, pbr, num_cpus, clap) that only its own bundled
# `extract-zim`/`zim-info` CLI binaries actually use; wikitui's own binary
# never links to those code paths. It targets ZIM major versions 5 and 6
# (what real Kiwix downloads use) and decodes Zstd/LZMA2/uncompressed
# clusters; `zim::ZimError::UnsupportedCompression` (`src/zim.rs`) covers the
# two compression tags (`bzip2`, `zlib`) this crate's own decompressor never
# implemented, turning what would otherwise be a `todo!()` panic on a rare
# archive into a clean error.
zim = "0.4.0"
# PRD SEC-4: OS keychain token storage, gated behind the off-by-default
# `keychain` feature above (see it for why). Optional so the default build
# links no secret-service/D-Bus machinery.
keyring = { version = "3", optional = true, default-features = false, features = ["sync-secret-service", "apple-native", "windows-native"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "gzip"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
textwrap = "0.16.2"
# PRD FR-PC-2 / SEC-5: `process` enables `tokio::process` — TTS playback
# spawns one child per paragraph and awaits it asynchronously (`tts::
# speak_one`) so a long article's playback never blocks the UI-owning
# thread (see `tts::TtsRuntime`'s doc comment for the full threading story).
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "test-util"] }
toml = "1.1.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
urlencoding = "2.1.3"
zstd = "0.13.3"
