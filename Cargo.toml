[package]
name = "wikitui"
version = "0.1.0"
edition = "2024"
description = "An unofficial, keyboard-first terminal (TUI) client for Wikipedia and Wikimedia sister projects"
# The LICENSE file in this repo is the unmodified AGPL-3.0 text with no
# project-specific "or any later version" notice attached (its own "how to
# apply these terms" appendix is the FSF's generic template for *other*
# projects, not this one's applied choice) — so the precise SPDX identifier
# is the closed variant, not "-or-later" (PRD §10 just says "AGPL-3.0",
# which this resolves unambiguously in the conservative direction).
license = "AGPL-3.0-only"
repository = "https://github.com/iamfoz/wikitui"
homepage = "https://github.com/iamfoz/wikitui"
readme = "README.md"
authors = ["Martyn Forryan <9133432+iamfoz@users.noreply.github.com>"]
keywords = ["wikipedia", "tui", "terminal", "cli", "reader"]
categories = ["command-line-utilities", "text-processing"]
# PRD §8's MSRV policy: "stable minus two" releases, bumped only as a minor-
# version event (matters for nixpkgs/Debian/Fedora toolchain pinning). At the
# time this was set, stable was 1.94; two releases back is 1.92 — bump this
# alongside a new stable release, not preemptively.
rust-version = "1.92"

[features]
# PRD SEC-4 / §5.9: the OS-keychain token backend (`keyring` crate). Off by
# default — the 0600-file store (always compiled) is the portable fallback,
# and a headless build (no D-Bus Secret Service, no macOS/Windows keychain,
# as in CI and containers) has nothing for `keyring` to talk to. Packagers
# targeting a desktop enable this so tokens land in the real OS keychain; the
# code behind it (`auth::KeyringTokenStore`) compiles against `keyring`'s
# stable `Entry` API but is unverifiable where no secret service exists. See
# `auth.rs`'s module doc for the full keychain-vs-file rationale.
#
# Build requirements when enabled: the Linux backend (`sync-secret-service`)
# links `libdbus-1` (`sudo apt install libdbus-1-dev pkg-config`); macOS and
# Windows use their native keychains and need no extra system packages. A
# headless container without libdbus (this build environment) cannot compile
# the feature — hence off by default, with the 0600 file store standing in.
keychain = ["dep:keyring"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ego-tree = "0.11.0"
# PRD FR-ACC-1 / §5.9: a proper CSPRNG for the PKCE `code_verifier` and the
# CSRF `state` parameter — never a PRNG or clock-seeded source. `getrandom`
# (already in the tree transitively) is the lightest option: a thin wrapper
# over the OS entropy source, no `rand` distribution machinery pulled in.
getrandom = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# PRD SEC-4: OS keychain token storage, gated behind the off-by-default
# `keychain` feature above (see it for why). Optional so the default build
# links no secret-service/D-Bus machinery.
keyring = { version = "3", optional = true, default-features = false, features = ["sync-secret-service", "apple-native", "windows-native"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "gzip"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
textwrap = "0.16.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "test-util"] }
toml = "1.1.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
urlencoding = "2.1.3"
zstd = "0.13.3"
