[package]
name = "wikitui"
version = "0.1.0"
edition = "2024"
description = "An unofficial, keyboard-first terminal (TUI) client for Wikipedia and Wikimedia sister projects"
# The LICENSE file in this repo is the unmodified AGPL-3.0 text with no
# project-specific "or any later version" notice attached (its own "how to
# apply these terms" appendix is the FSF's generic template for *other*
# projects, not this one's applied choice) — so the precise SPDX identifier
# is the closed variant, not "-or-later" (PRD §10 just says "AGPL-3.0",
# which this resolves unambiguously in the conservative direction).
license = "AGPL-3.0-only"
repository = "https://github.com/iamfoz/wikitui"
homepage = "https://github.com/iamfoz/wikitui"
readme = "README.md"
authors = ["Martyn Forryan <9133432+iamfoz@users.noreply.github.com>"]
keywords = ["wikipedia", "tui", "terminal", "cli", "reader"]
categories = ["command-line-utilities", "text-processing"]
# PRD §8's MSRV policy: "stable minus two" releases, bumped only as a minor-
# version event (matters for nixpkgs/Debian/Fedora toolchain pinning). At the
# time this was set, stable was 1.94; two releases back is 1.92 — bump this
# alongside a new stable release, not preemptively.
rust-version = "1.92"

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ego-tree = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "gzip"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
textwrap = "0.16.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "test-util"] }
toml = "1.1.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
urlencoding = "2.1.3"
zstd = "0.13.3"
